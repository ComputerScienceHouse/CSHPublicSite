title: "Projects"
intro: "Projects are an integral part of the living, learning experience at Computer Science House. This is a small sample of notable projects that our members have created:"

# As of 2025-11-09, most of these project names are proper nouns and should not
# be translated. This may not always be the case in the future, though, so they
# are stored here just in case.
project-1: "Drink/Snack"
project-1-desc: "Drink and Snack are two of CSH's oldest projects. These networked vending machines allow members to order items from any internet browser using a credits system."
project-2: "Schedule Maker"
project-2-desc: "Schedule Maker allows RIT students to plan their schedule for upcoming semesters. Users simply enter their course numbers and custom events and a list of all schedules that match their parameters will be shown. Because it is so easy and simple, Schedule Maker is now used by over 90% of RIT students."
project-3: "Devcade"
project-3-desc: "Devcade is a fully custom arcade machine made by a team of over a dozen CSH members. Devcade is an arcade built for developers, by developers. The arcade cabinet, software, and games for Devcade were mainly built during the Fall 2022 semester and the project is still being maintained and updated."
project-4: "HAROLD"
project-4-desc: "With HAROLD every member of CSH gets their own theme song. After a user uploads their song(s) to a web app, all they have to do is touch their iButton or RFID tag (received upon membership) to the appropriate reader."
project-5: "CSH Arcade" # This should be translated!
project-5-desc: "Two CSH members built this arcade cabinet from scratch. It emulates many classic arcade games from varying consoles and supports multiplayer. A second cabinet featuring a custom-made platforming game was also built. Both machines, along with other arcade cabinets CSH has acquired, are housed in our Library."
project-6: "Infosys"
project-6-desc: "Infosys is a multi-purpose display board located in our User Center. It is capable of displaying weather statistics, custom messages, and even real-time player data from video games."