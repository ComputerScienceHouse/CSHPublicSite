title: "Membership"

intro-1: "Computer Science House boasts some of the best minds in almost every computer-related field. As a member, you will be meeting people who can help you with your classes, teach you new tricks, and assist you in making the absolute most of your college experience, as well as making professional connections and friendships that will last you your entire life."
intro-2: "You don't need to be majoring in Computer Science, Software Engineering, or even anything related. Maybe you're a business major, or perhaps an art student; all we expect is that you have an interest in computers, a willingness to be active on floor, and a desire to excel in all aspects of your life."

incoming-title: "Incoming Students"
incoming-text: "Even before college, a great way to meet members and learn about CSH is to take a tour during RIT's open houses. On those days, members lead personalized tours of floor, highlighting our unique facilities, exemplary projects, and social atmosphere. For open house dates, visit the <a target=\"_blank\" rel=\"noopener\" href=\"https://www.rit.edu/admissions/freshman\">RIT admissions web site</a>. If you are unable to attend an open house, <a href=\"/contact/\">email our Evaluations Director</a> to schedule a time that is best for you. After being accepted to RIT, look for the Special Interest Housing selection in your RIT housing application to apply to CSH."

current-title: "Current Students"
current-text: "Students already enrolled at RIT can apply to join CSH at any time. The best way to apply is to visit CSH (on the third floor of Fredericka Douglass Sprague Perry Hall) and pick up an application from our Evaluations Director. All majors and years are accepted and members can live on or off floor."

expectations-title: "Member Expectations"
expectations-intro: "CSH has a number of requirements for its members, made to both maintain involvement and ensure growth as members and professionals. CSH expects its members to:"
expectations-1: "Attend weekly committee and House meetings"
expectations-2: "Attend some of our many social events and technical seminars"
expectations-3: "Complete a \"Major Project\" each year to contribute to CSH or enhance one's knowledge"
expectations-outro: "For more information on our introductory process, <a href=\"/membership/intro-process.html\">click here</a>."

benefits-title: "Member Benefits"
benefits-intro: "CSH's perks more than make up for all the work that goes into membership. All members, both on-floor and off-floor, get the following benefits:"
benefits-1: "Access to all of CSH's facilities (i.e. the Project room) and resources (i.e. web hosting and email)"
benefits-2: "Ability to request funds for technical projects, social events, and more"
benefits-3: "Voting privileges at all committee and House meetings to approve funds, accept new members, and have a say in how CSH is run"
benefits-4: "Knowledge and advice from some of the brightest minds in computing and related fields"
benefits-5: "Networking, storytelling, and donations from alumni in the industry"
benefits-6: "Professional and personal connections that last a lifetime"