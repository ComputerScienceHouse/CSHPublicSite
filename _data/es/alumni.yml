title: "Exalumnos"
content: "Computer Science House tiene más de 40 años de historia rica que nos convierte en la organización única que somos hoy, y tenemos que agradecer a nuestroos exalumnos por eso. Sobre los años, nuestros miembros han trabajado incansablemente para mejorar no solo nuestra comunidad, sino el mundo de la computación tal como lo conocemos. CSHeros ha seguido muchas carreras incredíbles, desde trabajar en corporaciones de billones de dólares hasta inciar sus propios negocios, incluyendo empresas tan importantes como Square y Pictometry."