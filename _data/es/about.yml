title: "Acerca de CSH"

pg-1: "Fundido en 1976, Computer Science House (Casa de informática) es una de las casas de interés especial más antiguas y activas de Rochester Institute of Technology en Rochester, NY. Ubicada en el tercer pisa del dormitorio Edificio de Fredericka Douglass Sprague Perry, CSH provee un etorno revolucionario de viviendo para más de cincuenta estudiantes en el piso y muchos más fuera del piso."
pg-2: "Además de las facilidades estándar de los dormitorios de RIT, CSH tiene varias salas especiales multiusos, llenas de recursos técnicos y materiales para que los miembros usen. Los recursos informáticos de CSH incluyen correo electrónico mantenido por estudiantes, grupos de noticias, bases de datos, servicias de especio web, una red cableada privada, y muchos servidores y estaciones de trabajo. Se enfatiza el aprendizaje práctico para ayudar a los miembros a obtener una ventaja en sus carreras profesionales y académicas."
pg-3: "CSH es un lugar emocionante para vivir y crecer. Siempre hay cosas divertidas que hacer, proyectos interesantes en los que trabajar, y miembros que están ansiosos por compartir sus experiencias en una amplía variedad de temas. Los miembros comparten un sentimiento de parentesco, pertenencia, y compromiso entre ellos y la organización. El piso tiene una única ambiente social y académica: a la gente aquí le gusta aprender."
pg-4: "CSH organiza eventos anuales como Tour de Rochester, Welcome Back (Bienvenida de vuelta), Fall Camping (Campamento de otoño), y Holiday Dinner (Cena de fiestas). Otros eventos como seminarios educativos, sesiones de estudio, hackatones, noches de películas, Capture the Disk (Captura el disco), viajes por carretera, y noches de bolos también occuren frecuentemente. Los miembros juegan deportes intramuros como el voleibol, el balón prisionero, el fútbol, y el broomball juntos."
pg-5: "Aunque mucho ha cambiado a lo largo de los sobre los años, la misión de CSH de ayudar a sus miebros a crecer intelecualmente, socialmente, y profesionalmente continúa teniendo éxito y surperando las expectativas."
