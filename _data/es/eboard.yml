title: Junta ejecutiva

summary: "La junta ejecutiva es responsable de garantizar que las funciones integrales para la experiencia de CSH iran lo más suavemente posible. Elegidos al final de cada año académico, ellos ofrecen su tiempo para ayudar a hacer el piso un lugar aún mejor para estar."

chair: "Presidente"
chair-text: "El presidente de CSH sirve como el jefe de la junta ejecutiva, supervisando las actividades de los directores y presidiendo nuestras reuniones semanales de la casa. También, es el portavoz principal de la casa, representando los intereses de nuestros miembros en las comunicaciones con RIT y el resto del mundo."

evals: "Evaluaciones"
evals-text: "Evaluaciones es responsable de conectarse con la comunidad estudiantil de RIT, así como organizar el proceso de selección, aceptación y bienvenida de nuevos miembros. ¡Los miembros no estarían aquí sin evaluaciones!"
evals-addl: "Si deseas visitar o hacer un recorrido por el piso, <a href=\"/contact/\">avísale al director de evaluaciones</a> y él puede organizar esto."

financial: "Finanzas"
financial-text: "Finanzas es responsable de administrar las finanzas de CSH, recolectar las cuotas semestrales de los miembros y tramar nuevos planes de recaudación de fondos. Todo nuestro dinero va hacia nuevos recursos y componentes de proyectos para que los miembros usen; CSH es una organización sin fines de lucro registrada con un presupuesto anual auto-generado."

history: "Historia"
history-text: "La responsibilidad principal del director de historia es mantener abierta la línea de comunicación entre CSH y nuestras exalumnos. Creemos que los miembros deben tener una comprensión bien desarrollada de los orígenes y logros de la casa. La historia mantiene el pasado vivo a través del anuario, el boletín informativo Coredump, las exhibiciones en el piso, archivar, actualizar la base de datos de medios y administrar las relaciones con los exalumnos. La historia también coordina las noches de cuentos de exalumnos y otros eventos tradicionales."

imps: "Mejoras del piso"
imps-text: "Mejoras del piso es responsable de mantener nuestro espacio de vida respetable y cómodo. Delegan proyectos que mejoran los aspectos físicos del piso, como pintar, limpiar, construir y organizar los recursos de la casa. Aunque no seamos el grupo de personas más ordenado, nos gusta cuidar nuestro piso, y se nota."

opcomm: "OpComm (comité de operaciones y comunicaciones)"
opcomm-text: "El director de OpComm, junto con un grupo de miembros técnicamente capacitados conocidos como RTPs, es responsable de mantener los servidores y la infraestructura de red de CSH. Convertirse en un RTP permite a los miembros desarrollar y practicar habilidades que son esenciales para trabajar en campos de computación. Si tienes alguna pregunta sobre los recursos técnicos de la casa, ¡el director de OpComm debe ser tu primera parada!"

rnd: "Investigación y desarrollo"
rnd-text: "I+D es responsable de organizar seminarios y asistir con proyectos técnicos, con el objectivo de alentar a los miembros a aprender nuevas habilidades y ganar experiencia."

social: "Social"
social-text: "Social es responsable de planificar y ejecutar eventos sociales para nuestros miembros, como Welcome Back (Bienvenida de vuelta), noches de películas y otros eventos en el piso y alrededor de Rochester."

pr: "Relaciones públicas"
pr-text: "Relaciones públicas es responsable de mantener la imagen pública de CSH, principalmente a través de la gestión de nuestras varias cuentas de redes sociales. Trabaja para compartir toda la información sobre la organización, y lo que pasa en ella, así como contactar a varias partes externas, incluyendo pero no limitado a empleadores, estudiantes y medios de comunicación para compartir lo que estamos haciendo. Síguenos en <a href=\"https://twitter.com/RITCSH\">Twitter</a>, <a href=\"https://www.instagram.com/computersciencehouse/\">Instagram</a>, y <a href=\"https://www.facebook.com/RITCSH\">Facebook</a>."