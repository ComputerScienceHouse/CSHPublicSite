title: "FAQ (Preguntas frecuentes)"

q1: "¿Necesito ser estudiante de informática para unirme?"
a1: "No, ¡CSH acepta estudiantes de cualquier programa en RIT!"

q2: "¿Necesito ser de primero para unirme?"
a2: "Además, ¡no! ¡Puedes unirte a nuestro proceso introductorio en cualquier punto de tu carrera académica en RIT! <a href=\"/membership/intro-process.html\">Aprende más sobre cómo presentarse</a>."

q3: "¿Cómo me uno?"
a3: "Mira nuestra página sobre <a href=\"/membership/intro-process.html\">nuevos miembros</a> para obtener más información acerca de cómo postularse y unirse a CSH."

q4: "¿Cuesta algo ser miembro?"
a4: "Nuestra cuota de afiliación activa es de $80/semestre. Nuestro presupuesto operativo se forma cada año a partir de las cuotas pagadas por los miembros además de los patrocinadores, ¡y ayuda a financiar mejoras en nuestro piso, proyectos de miembros, y eventos sociales! Los miembros que no puedan pagar sus cuotas pueden hablar con nuestro Director Financiero y hacer que se les exima o ajuste sus cuotas."

q5: "¿Es CSH una fraternidad?"
a5: "No, somos un Special Interest House (Casa de interés especial): un espacio en los dormitorios de RIT diseñado para que los estudiantes que comparten intereses comunes vivan juntos. Lee más sobre las SIHs <a href=\"https://www.rit.edu/fa/housing/housing-option/special-interest-lifestyle-floors\">aquí</a>, y más sobre el RIT Fraternity and Sorority Life (Vida de fraternidades y sororidades de RIT) <a href=\"https://campusgroups.rit.edu/fsl/about/\">aquí</a>."

end: "¿No puedes encontrar tu pregunta aquí? <a href=\"/contact/\">Contáctanos</a>."