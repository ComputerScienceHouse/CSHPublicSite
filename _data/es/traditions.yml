title: "Tradiciones"

intro: "CSH no se trata solo de trabajar en proyectos. A nuestros miembros les encanta participar en una variedad de actividades sociales. Muchas de estas actividades han persistido a lo largo de los años para convertirse en tradiciones."

welcome-back-title: "Bienvenida de vuelta"
welcome-back-text: "Bienvenida de vuelta es una barbacoa que se celebra al comienzo de cada año para dar la bienvenida a la clase de primer año entrante. Tradicionalmente, los exalumnos vienen de todas partes para visitar a los miembros actuales del piso. Cocinamos demasiada comida, contamos historias y participamos en una variedad de actividades al aire libre."

camping-title: "Campamento de otoño"
camping-text: "Cada año, CSH sale a una aventura para ver si podemos sobrevivir un fin de semana en la naturaleza. Sorprendentemente, un grupo de nerds de computadoras puede prosperar sin electricidad durante unos días."

holiday-dinner-title: "Cena de fiestas"
holiday-dinner-text: "Cena de fiestas es nuestra cena formal anual que tiene lugar justo antes de las vacaciones de invierno. Todo CSH se viste elegante y cena en un restaurante elegante."

seminars-title: "Seminarios"
seminars-text: "Cualquier miembro puede realizar un seminario para enseñar a otros un poco sobre un tema de su elección. Los temas pueden variar desde programación hasta malabarismo y todo lo demás, y cualquiera puede dar uno en cualquier momento."

intramural-sports-title: "Deportes intramuros"
intramural-sports-text: "Participamos en la mayoría de los deportes intramuros que RIT ofrece, incluyendo broomball, hockey, fútbol, baloncesto, softball, dodgeball y voleibol. Aunque no siempre somos el mejor equipo, siempre somos los que mejor nos vemos (con nuestras camisetas de CSH) y tenemos a los mejores fanáticos animándonos. Incluso hemos ganado una cantidad bastante impresionante de trofeos en el pasado, que se exhiben con orgullo en nuestra biblioteca."