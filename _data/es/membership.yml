title: "Afiliación"

intro-1: "Computer Science House presume de algunas de las mejores mentes en casi todos los campos relacionados con la informática. Como miembro, conocerás a personas que pueden ayudarte con tus clases, enseñarte nuevos trucos y asistirte para aprovechar al máximo tu experiencia universitaria, así como hacer conexiones profesionales y amistades que durarán toda tu vida."
intro-2: "No necesitas estar estudiando informática, ingeniería de software o incluso algo relacionado. Tal vez seas un estudiante de negocios o quizás un estudiante de arte; todo lo que esperamos es que tengas interés en las computadoras, una disposición para ser activo en el piso y un deseo de sobresalir en todos los aspectos de tu vida."

incoming-title: "Estudiantes entrantes"
incoming-text: "Incluso antes de la universidad, una excelente manera de conocer a los miembros y aprender sobre CSH es tomar un recorrido durante las jornadas de puertas abiertas de RIT. En esos días, los miembros lideran recorridos personalizados por el piso, destacando nuestras instalaciones únicas, proyectos ejemplares y ambiente social. Para las fechas de las jornadas de puertas abiertas, visita el <a target=\"_blank\" rel=\"noopener\" href=\"https://www.rit.edu/admissions/freshman\">sitio web de admisiones de RIT</a>. Si no puedes asistir a una jornada de puertas abiertas, <a href=\"/contact/\">envía un correo electrónico a nuestro director de evaluaciones</a> para programar un tiempo que sea mejor para ti. Después de ser aceptado en RIT, busca la selección de Special Interest Housing (Casas de interés especial) en tu solicitud de vivienda en RIT para postularte a CSH."

current-title: "Estudiantes actuales"
current-text: "Los estudiantes que ya están inscritos en RIT pueden postularse para unirse a CSH en cualquier momento. La mejor manera de postularse es visitar CSH (en el tercer piso de Fredericka Douglass Sprague Perry Hall) y recoger una solicitud de nuestro director de evaluaciones. Aceptamos todas la espcialidades y años, y los miembros pueden vivir dentro o fuera del piso."

expectations-title: "Expectativas para los miembros"
expectations-intro: "CSH tiene una serie de requisitos para sus miembros, diseñados tanto para mantener la participación como para garantizar el crecimiento como miembros y profesionales. CSH espera que sus miembros:"
expectations-1: "Asistan a las reuniones semanales de comités y de la casa"
expectations-2: "Asistan a algunos de nuestros muchos eventos sociales y seminarios técnicos"
expectations-3: "Completen un \"proyecto principal\" cada año para contribuir a CSH o mejorar su conocimiento"
expectations-outro: "Para obtener más información sobre nuestro proceso de introducción, <a href=\"/membership/intro-process.html\">haz clic aquí</a>."

benefits-title: "Beneficios para los miembros"
benefits-intro: "Los beneficios de CSH compensan con creces todo el trabajo que implica ser miembro. Todos los miembros, tanto dentro como fuera del piso, obtienen los siguientes beneficios:"
benefits-1: "Acceso a todas las instalaciones de CSH (es decir, la sala de proyectos) y recursos (es decir, alojamiento web y correo electrónico)"
benefits-2: "Capacidad para solicitar fondos para proyectos técnicos, eventos sociales y más"
benefits-3: "Privilegios de voto en todas las reuniones de comités y de la casa para aprobar fondos, aceptar nuevos miembros y tener voz en cómo se administra CSH"
benefits-4: "Conocimiento y consejos de algunas de las mentes más brillantes en informática y campos relacionados"
benefits-5: "Redes, narración de historias y donaciones de exalumnos en la industria"
benefits-6: "Conexiones profesionales y personales que duran toda la vida"