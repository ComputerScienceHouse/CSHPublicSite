baseURL = "https://csh.rit.edu/"
locale = "en-us"
title = "Computer Science House"
theme = "csh"
enableRobotsTXT = true
enableEmoji = true

[params]
  assetsURL = "https://assets.csh.rit.edu/pubsite"
  # Existing brand tagline (see content-critique.md for notes on this wording)
  tagline = "Getting more done after 2am than most people do all day."
  # Meta description uses existing on-site copy (first sentence of the About page)
  description = "Since 1976, Computer Science House has provided a revolutionary living and learning environment for its members."
  foundedYear = 1976
  email = "webmaster@csh.rit.edu"
  donateURL = "https://www.rit.edu/giving/ComputerScienceHouse"
  brandColors = ["#B0197E", "#E11C52"]

  [params.social]
    github = "https://github.com/computersciencehouse/"
    facebook = "https://www.facebook.com/RITCSH/"
    instagram = "https://www.instagram.com/computersciencehouse/"
    twitter = "https://twitter.com/RITCSH"

# Footer utility links (mirrors the old footer's "footer-top" row)
[[params.footerLinks]]
  name = "FAQ"
  url = "/about/faq/"
[[params.footerLinks]]
  name = "How to Apply"
  url = "/membership/intro-process/"
[[params.footerLinks]]
  name = "RIT ScheduleMaker"
  url = "https://schedule.csh.rit.edu/"
[[params.footerLinks]]
  name = "Blog"
  url = "/blog/"
[[params.footerLinks]]
  name = "Constitution"
  url = "https://constitution.csh.rit.edu/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2

[taxonomies]
  category = "categories"

