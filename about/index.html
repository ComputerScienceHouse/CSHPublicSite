---
layout: page
active: about
strings: "about"
---
{% assign strings = site.data[site.active_lang][page.strings] %}

<div class="gray-wrapper" id="about-page">
    <div class="container spaced">
        <div class="row">
            <div class="col-12 col-lg-8">
                <p class="long-form">
                    {{ strings.pg-1 }}
                </p>
                <p class="long-form">
                    {{ strings.pg-2 }}
                </p>
            </div>
            <div class="col-12 col-lg-4 text-center">
                <img class="rounded center-vertically" src="{{site.env.CSHPUBSITE_ASSETS_URL}}/about/main.png" alt="Three CSHers hanging out during a Lounge In The Quad event">
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <p class="long-form">
                    {{ strings.pg-3 }}
                </p>
            </div>
        </div>
        <div class="row">
            <div class="col-12 col-lg-4 text-center">
                <img class="rounded center-vertically" src="{{site.env.CSHPUBSITE_ASSETS_URL}}/about/events.png" alt="CSHers on our annual fall camping trip">
            </div>
            <div class="col-12 col-lg-8">
                <p class="long-form">
                    {{ strings.pg-4 }}
                </p>
                <p class="long-form">
                    {{ strings.pg-5 }}
                </p>
                <a class="btn btn-primary" href="/membership/traditions.html">{{ strings.button }}</a>
            </div>
        </div>
    </div>
</div>
