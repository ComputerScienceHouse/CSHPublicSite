# Homepage content. Image paths are relative to params.assetsURL

hero:
  title: "Computer Science House"
  subtitle: "Getting more done after 2am than most people do all day."
  image: "/welcome_back_large.webp"
  imageAlt: "A group of CSHers standing in front of a lake"
  ctas:
    - text: "Join CSH"
      url: "/membership/"
      style: "primary"
    - text: "About us"
      url: "/about/"
      style: "ghost"

# Three primary wayfinding cards
features:
  - title: "About us"
    url: "/about/"
    image: "/disk.webp"
  - title: "Our projects"
    url: "/about/projects/"
    image: "/drink.webp"
  - title: "Visit CSH"
    url: "/about/tour/"
    image: "/project_room.webp"

about:
  image: "/about_image.webp"
  imageAlt: "A group of CSHers at our annual camping trip"
  body: "Since 1976, Computer Science House has provided a revolutionary living and learning environment for its members. With unique facilities, an emphasis on hands-on learning, and a strong social atmosphere, CSH helps its members grow as professionals and more."
  cta:
    text: "More about CSH"
    url: "/about/"

workingOn:
  heading: "Things we're working on ..."
  items:
    - title: "Server room upgrade"
      image: "/server.webp"
      alt: "A picture of CSH's server racks"
      description: "Bringing our servers up to date with the help of Wayfair."
    - title: "TUNES"
      image: "/TUNES.webp"
      alt: "TUNES, an old jukebox that's being made digital"
      description: "Modernizing a jukebox"
    - title: "Infosys"
      image: "/infosys.webp"
      alt: "A LED matrix that makes up CSH's Infosys"
      description: "An information display system"
    - title: "Letmein"
      image: "/letmein.webp"
      alt: "A raspberry pi and pencil sharpener on the wall, CSH's letmein system"
      description: "A physical notification system for members"

statsHeading: "Some facts about us ..."
sponsorsHeading: "Sponsors"
