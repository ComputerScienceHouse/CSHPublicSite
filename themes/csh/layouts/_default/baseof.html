<!DOCTYPE html>
<html lang="en-us" data-theme-default>
{{ partial "head.html" . }}
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{- $nav := resources.Get "js/nav.js" | minify | fingerprint -}}
  <script src="{{ $nav.RelPermalink }}" defer></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
